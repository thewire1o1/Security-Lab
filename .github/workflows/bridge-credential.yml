name: APOTHEON ONE Bridge Credential Provisioning

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: apotheon-one-bridge-credential-provisioning
  cancel-in-progress: false

jobs:
  provision:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[DPSR-BRIDGE-AUTH] provision'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      WAKE_TOKEN: ${{ secrets.DPSR_CODESPACES_TOKEN }}
      BRIDGE_TOKEN: ${{ secrets.DPSR_BRIDGE_TOKEN || secrets.DPSR_CODESPACES_TOKEN }}
    steps:
      - name: Provision isolated Codespaces bridge credential
        id: provision
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${WAKE_TOKEN:-}" ]; then
            printf '%s\n' 'DPSR_CODESPACES_TOKEN is not configured.' >&2
            exit 2
          fi
          if [ -z "${BRIDGE_TOKEN:-}" ]; then
            printf '%s\n' 'No bridge credential source is configured.' >&2
            exit 3
          fi

          login="$(GH_TOKEN="$WAKE_TOKEN" gh api user --jq .login)"
          if [ "${login,,}" != "${REPOSITORY_OWNER,,}" ]; then
            printf '%s\n' 'Codespaces controller credential belongs to the wrong GitHub account.' >&2
            exit 4
          fi

          printf '%s' "$BRIDGE_TOKEN" | GH_TOKEN="$WAKE_TOKEN" gh secret set \
            DPSR_BRIDGE_TOKEN \
            --app codespaces \
            --repo "$REPOSITORY"

          if ! GH_TOKEN="$WAKE_TOKEN" gh secret list --app codespaces --repo "$REPOSITORY" \
            | awk '{print $1}' \
            | grep -Fxq 'DPSR_BRIDGE_TOKEN'; then
            printf '%s\n' 'Codespaces bridge credential could not be verified after provisioning.' >&2
            exit 5
          fi

          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --body 'APOTHEON ONE bridge credential provisioned for repository Codespaces. Restart the target Codespace to load the credential.'
          gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --reason completed

      - name: Report provisioning failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --body 'APOTHEON ONE bridge credential provisioning failed. Existing Codespaces secrets were not intentionally removed.' || true
          gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --reason 'not planned' || true

  repair:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[DPSR-REPAIR] Codespace runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      WAKE_TOKEN: ${{ secrets.DPSR_CODESPACES_TOKEN }}
    steps:
      - name: Repair and verify Codespace runtime
        id: repair
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${WAKE_TOKEN:-}" ]; then
            printf '%s\n' 'DPSR_CODESPACES_TOKEN is not configured.' >&2
            exit 2
          fi

          requested="$(printf '%s\n' "${ISSUE_BODY:-}" | sed -nE 's/^codespace:[[:space:]]*([A-Za-z0-9][A-Za-z0-9-]{0,127})[[:space:]]*$/\1/p' | head -n1)"
          if [ -z "$requested" ]; then
            payload="$(GH_TOKEN="$WAKE_TOKEN" gh api '/user/codespaces?per_page=100')"
            requested="$(printf '%s' "$payload" | jq -r --arg repo "$REPOSITORY" '[.codespaces[] | select(.repository.full_name == $repo)] | sort_by(.last_used_at // .updated_at // .created_at) | reverse | .[0].name // empty')"
          fi
          [ -n "$requested" ] || { echo 'No Codespace found.' >&2; exit 3; }
          printf 'codespace=%s\n' "$requested" >> "$GITHUB_OUTPUT"

          state="$(GH_TOKEN="$WAKE_TOKEN" gh api "/user/codespaces/$requested" --jq '.state // "Unknown"')"
          if [ "$state" = 'Shutdown' ]; then
            GH_TOKEN="$WAKE_TOKEN" gh api --method POST "/user/codespaces/$requested/start" >/dev/null
          fi
          for _ in $(seq 1 180); do
            state="$(GH_TOKEN="$WAKE_TOKEN" gh api "/user/codespaces/$requested" --jq '.state // "Unknown"')"
            [ "$state" = 'Available' ] && break
            sleep 2
          done
          [ "$state" = 'Available' ] || { echo "Codespace did not become Available: $state" >&2; exit 4; }

          ssh_ready=0
          for _ in $(seq 1 120); do
            if GH_TOKEN="$WAKE_TOKEN" gh codespace ssh -c "$requested" -- true >/dev/null 2>&1; then
              ssh_ready=1
              break
            fi
            sleep 3
          done
          [ "$ssh_ready" = 1 ] || { echo 'Codespace SSH did not become ready.' >&2; exit 5; }

          GH_TOKEN="$WAKE_TOKEN" gh codespace ssh -c "$requested" -- bash -lc '
            set -Eeuo pipefail
            cd /workspaces/Security-Lab

            for _ in $(seq 1 180); do
              if ! pgrep -af "[.]devcontainer/bootstrap.sh" >/dev/null 2>&1; then
                break
              fi
              sleep 3
            done

            git fetch origin master
            if git diff --quiet && git diff --cached --quiet; then
              git merge --ff-only origin/master
            else
              echo "Working tree has tracked changes; leaving source untouched." >&2
            fi

            mkdir -p reports
            bash admin/control-plane-supervisor restart

            dashboard_ok=0
            for _ in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8765/health | grep -q '"'"'"ok"'"'":true'; then
                dashboard_ok=1
                break
              fi
              sleep 2
            done
            [ "$dashboard_ok" = 1 ] || {
              echo "Dashboard health check failed." >&2
              tail -n 80 reports/dashboard.log 2>/dev/null || true
              tail -n 80 reports/control-plane-supervisor.log 2>/dev/null || true
              exit 20
            }

            if ! bash bin/mcp-control status >/dev/null 2>&1; then
              echo "MCP health check failed." >&2
              tail -n 80 reports/mcp-server.log 2>/dev/null || true
              exit 21
            fi
          '

          printf 'console_url=https://%s-8765.app.github.dev\n' "$requested" >> "$GITHUB_OUTPUT"
          printf 'mcp_url=https://%s-8766.app.github.dev/mcp\n' "$requested" >> "$GITHUB_OUTPUT"

      - name: Report runtime recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CODESPACE: ${{ steps.repair.outputs.codespace }}
          CONSOLE_URL: ${{ steps.repair.outputs.console_url }}
          MCP_URL: ${{ steps.repair.outputs.mcp_url }}
        run: |
          body=$(cat <<EOF
          Runtime recovery completed and verified from inside the Codespace.

          Codespace: \`${CODESPACE}\`
          APOTHEON ONE console: ${CONSOLE_URL}
          MCP endpoint (client use): ${MCP_URL}
          EOF
          )
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "$body"
          gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --reason completed

      - name: Report runtime recovery failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --body 'Runtime recovery failed. The Codespace was left intact for diagnosis.' || true
          gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --reason 'not planned' || true
