name: APOTHEON ONE Security Operator Image

on:
  push:
    branches: [master]
    paths:
      - 'lab/kali/Dockerfile'
      - 'lab/docker-compose.yml'
      - '.github/workflows/kali-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: apotheon-one-security-operator-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, publish, and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish security operator image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./lab/kali
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/apotheon-one-kali:latest
            ghcr.io/${{ github.repository_owner }}/dpsr-kali:latest
          labels: |
            org.opencontainers.image.title=APOTHEON ONE Security Operator
            org.opencontainers.image.description=APOTHEON ONE security research Kali operator image by Digital Paragon
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/apotheon-one-kali
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
