name: APOTHEON ONE Runtime Repair

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: apotheon-one-runtime-repair-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[DPSR-REPAIR] Codespace runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.DPSR_CODESPACES_TOKEN }}
      ACTIONS_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - name: Repair and verify runtime
        id: repair
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'DPSR_CODESPACES_TOKEN is not configured.' >&2
            exit 2
          fi

          requested="$(printf '%s\n' "${ISSUE_BODY:-}" | sed -nE 's/^codespace:[[:space:]]*([A-Za-z0-9][A-Za-z0-9-]{0,127})[[:space:]]*$/\1/p' | head -n1)"
          if [ -z "$requested" ]; then
            requested="$(gh api '/user/codespaces?per_page=100' --jq --arg repo "$REPOSITORY" '[.codespaces[] | select(.repository.full_name == $repo)] | sort_by(.last_used_at // .updated_at // .created_at) | reverse | .[0].name // empty')"
          fi
          if [ -z "$requested" ]; then
            echo 'No Codespace found.' >&2
            exit 3
          fi
          echo "codespace=$requested" >> "$GITHUB_OUTPUT"

          state="$(gh api "/user/codespaces/$requested" --jq '.state // "Unknown"')"
          if [ "$state" = 'Shutdown' ]; then
            gh api --method POST "/user/codespaces/$requested/start" >/dev/null
          fi

          for _ in $(seq 1 180); do
            state="$(gh api "/user/codespaces/$requested" --jq '.state // "Unknown"')"
            [ "$state" = 'Available' ] && break
            sleep 2
          done
          [ "$state" = 'Available' ] || { echo "Codespace did not become Available: $state" >&2; exit 4; }

          ssh_ready=0
          for _ in $(seq 1 120); do
            if gh codespace ssh -c "$requested" -- true >/dev/null 2>&1; then
              ssh_ready=1
              break
            fi
            sleep 3
          done
          [ "$ssh_ready" = 1 ] || { echo 'Codespace SSH did not become ready.' >&2; exit 5; }

          gh codespace ssh -c "$requested" -- bash -lc '
            set -Eeuo pipefail
            cd /workspaces/Security-Lab

            for _ in $(seq 1 180); do
              if ! pgrep -af "[.]devcontainer/bootstrap.sh" >/dev/null 2>&1; then
                break
              fi
              sleep 3
            done

            git fetch origin master
            if git diff --quiet && git diff --cached --quiet; then
              git merge --ff-only origin/master
            else
              echo "Working tree has tracked changes; leaving source untouched." >&2
            fi

            mkdir -p reports
            bash admin/control-plane-supervisor restart

            dashboard_ok=0
            for _ in $(seq 1 60); do
              if python3 - <<"PY"
import json
import urllib.request
try:
    with urllib.request.urlopen("http://127.0.0.1:8765/health", timeout=1.0) as response:
        payload = json.loads(response.read().decode("utf-8"))
except Exception:
    raise SystemExit(1)
raise SystemExit(0 if payload.get("ok") is True else 1)
PY
              then
                dashboard_ok=1
                break
              fi
              sleep 2
            done

            if [ "$dashboard_ok" != 1 ]; then
              echo "Dashboard health check failed." >&2
              tail -n 80 reports/dashboard.log 2>/dev/null || true
              tail -n 80 reports/control-plane-supervisor.log 2>/dev/null || true
              exit 20
            fi

            if ! bash bin/mcp-control status >/dev/null 2>&1; then
              echo "MCP health check failed." >&2
              tail -n 80 reports/mcp-server.log 2>/dev/null || true
              exit 21
            fi
          '

          echo 'verified=true' >> "$GITHUB_OUTPUT"
          echo "console_url=https://${requested}-8765.app.github.dev" >> "$GITHUB_OUTPUT"
          echo "mcp_url=https://${requested}-8766.app.github.dev/mcp" >> "$GITHUB_OUTPUT"

      - name: Report repair result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CODESPACE: ${{ steps.repair.outputs.codespace }}
          CONSOLE_URL: ${{ steps.repair.outputs.console_url }}
          MCP_URL: ${{ steps.repair.outputs.mcp_url }}
        run: |
          body=$(cat <<EOF
          Runtime repair completed and verified from inside the Codespace.

          Codespace: \`${CODESPACE}\`
          APOTHEON ONE console: ${CONSOLE_URL}
          MCP endpoint (client use): ${MCP_URL}
          EOF
          )
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "$body"
          gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --reason completed

      - name: Report repair failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body 'Runtime repair failed. The Codespace was left intact for diagnosis.' || true
          gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --reason 'not planned' || true
