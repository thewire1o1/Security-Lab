services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: ai-lab-juice-shop
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks: [security-lab]

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: ai-lab-dvwa
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    networks: [security-lab]

  webgoat:
    image: webgoat/webgoat:latest
    container_name: ai-lab-webgoat
    restart: unless-stopped
    environment:
      WEBGOAT_PORT: "8080"
    ports:
      - "127.0.0.1:8081:8080"
    networks: [security-lab]

  kali:
    profiles: ["operator"]
    build:
      context: ./kali
    image: ai-security-lab-kali:latest
    container_name: ai-lab-kali
    stdin_open: true
    tty: true
    working_dir: /workspace
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../:/workspace
      - kali-home:/root
    networks: [security-lab]

networks:
  security-lab:
    driver: bridge

volumes:
  kali-home:
