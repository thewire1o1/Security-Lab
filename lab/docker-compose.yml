services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: sec-lab-juice-shop
    restart: unless-stopped
    init: true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    networks: [security-lab]

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: sec-lab-dvwa
    restart: unless-stopped
    init: true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:80"
    networks: [security-lab]

  webgoat:
    image: webgoat/webgoat:latest
    container_name: sec-lab-webgoat
    restart: unless-stopped
    init: true
    pids_limit: 384
    mem_limit: 1536m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    environment:
      WEBGOAT_PORT: "8080"
    ports:
      - "127.0.0.1:8081:8080"
    networks: [security-lab]

  kali:
    profiles: ["operator"]
    image: ghcr.io/thewire1o1/security-lab-kali:latest
    build:
      context: ./kali
    container_name: sec-lab-kali
    stdin_open: true
    tty: true
    working_dir: /workspace
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../:/workspace
      - kali-home:/root
    networks:
      - security-lab
      - operator-egress

networks:
  security-lab:
    driver: bridge
    internal: true
  operator-egress:
    driver: bridge

volumes:
  kali-home:
